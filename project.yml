name: CutSzn
options:
  bundleIdPrefix: com.zzoutuo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: JP4TN5PTS3
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    SWIFT_EMIT_LOC_STRINGS: YES
    ITSAppUsesNonExemptEncryption: NO
targets:
  CutSzn:
    type: application
    platform: iOS
    sources:
      - path: CutSzn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.CutSzn
        PRODUCT_NAME: CutSzn
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CutSzn
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "CutSzn reads your body weight from Health so your morning weigh-in syncs automatically. Health data never leaves your device."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "CutSzn can save your weigh-ins to Health so your weight history stays in one place."
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo of your meal so CutSzn can break down sodium, carbs, and fiber against today's protocol."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Choose a meal photo from your library for nutrition analysis."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save your Made Weight share card to your photo library."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: CutSzn/CutSzn.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.zzoutuo.CutSzn
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        com.apple.security.application-groups:
          - group.com.zzoutuo.CutSzn
    dependencies:
      - target: CutSznWidget
        embed: true
  CutSznWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CutSznWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.CutSzn.widget
        PRODUCT_NAME: CutSznWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CutSznWidget/Info.plist
        SKIP_INSTALL: YES
    entitlements:
      path: CutSznWidget/CutSznWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zzoutuo.CutSzn
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.zzoutuo.CutSzn
        com.apple.developer.icloud-services:
          - CloudKit
schemes:
  CutSzn:
    build:
      targets:
        CutSzn: all
        CutSznWidget: all
    run:
      config: Debug
      storeKitConfiguration: CutSzn/Resources/CutSzn.storekit
    archive:
      config: Release
